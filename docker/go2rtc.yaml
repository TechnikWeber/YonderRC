# go2rtc configuration for YonderRC — verified against go2rtc 1.9.14.
#
# go2rtc captures the camera, hardware-encodes H.264 and publishes it over WebRTC.
# The ground app plays it via go2rtc's WebRTC endpoint (/api/webrtc?src=NAME).
# Each entry under `streams` is one selectable camera in the app's switcher.

api:
  listen: ":1984" # WebRTC signaling + web UI: http://<vehicle>:1984
  origin: "*" # allow the ground web app (different port in dev) to connect

rtsp:
  listen: ":8554" # used internally by the exec test source below

webrtc:
  listen: ":8555" # WebRTC media (UDP+TCP)
  candidates:
    - stun:8555 # discover the public address for LTE; add a TURN server for CGNAT

streams:
  # --- SIM: synthetic test pattern, no camera needed (verified working) --------
  test: exec:ffmpeg -re -f lavfi -i testsrc=size=1280x720:rate=25 -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 25 -f rtsp {output}

  # --- Raspberry Pi camera (libcamera) — enable on real hardware ---------------
  # rpicam: exec:libcamera-vid -t 0 --inline --nopreview --codec h264 --width 1280 --height 720 --framerate 30 --intra 30 -o - | ffmpeg -i - -c copy -f rtsp {output}

  # --- USB camera (V4L2); use the cam's own H.264 if it has one ----------------
  # usb0: ffmpeg:/dev/video0#video=h264#hardware

# Lowest-latency notes for real hardware later:
#  - keep GOP short (intra ~= framerate) so new viewers sync fast
#  - prefer the camera's own H.264 (no re-encode)
#  - on Pi 4 / Pi Zero 2 W use the hardware H.264 encoder; the Pi 5 lacks one
