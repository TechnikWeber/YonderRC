<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>YonderRC — Setup</title>
    <style>
      :root {
        --bg: #0b0f14; --panel: #121821; --panel-2: #0f141b; --line: #1e2833;
        --line-b: #2b3947; --text: #c7d1dc; --muted: #6b7986; --accent: #35d0c3;
        --go: #46d17f; --idle: #f2b74a; --bad: #ff5d5d;
        --mono: ui-monospace, Menlo, Consolas, monospace;
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
      .wrap { max-width: 640px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      h1 { font-size: 20px; margin: 4px 0; }
      .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
      .row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 14px; }
      .row .k { color: var(--muted); }
      .row .v { font-family: var(--mono); text-align: right; }
      .v.go { color: var(--go); } .v.bad { color: var(--bad); } .v.warn { color: var(--idle); }
      label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
      input, select {
        background: var(--panel-2); border: 1px solid var(--line-b); color: var(--text);
        font-family: var(--mono); font-size: 14px; padding: 10px 12px; border-radius: 8px;
        width: 100%; min-width: 0;
      }
      .grid2 > label, .grid3 > label, .grid4 > label { min-width: 0; }
      input:focus, select:focus { outline: 2px solid var(--accent); }
      .btn {
        appearance: none; border: 1px solid var(--line-b); background: var(--panel-2); color: var(--text);
        font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 8px; cursor: pointer;
      }
      .btn.primary { border-color: var(--accent); color: var(--accent); }
      .btn.bad { border-color: var(--bad); color: var(--bad); }
      .btns { display: flex; gap: 8px; flex-wrap: wrap; }
      .msg { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 18px; }
      .msg a { color: var(--accent); word-break: break-all; }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
      .grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }
      .item { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; background: var(--panel-2); }
      .eyebrow2 { font-size: 11px; color: var(--muted); margin: 10px 0 6px; text-transform: uppercase; letter-spacing: 0.08em; }
      .btn.tiny { padding: 4px 10px; font-size: 12px; }
      .chk { flex-direction: row; align-items: center; gap: 8px; color: var(--text); }
      .foot { text-align: center; color: var(--muted); font-size: 11px; padding: 8px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>YonderRC · Setup</h1>

      <section class="panel">
        <div class="eyebrow">System status</div>
        <div id="status"><div class="row"><span class="k">loading…</span></div></div>
      </section>

      <section class="panel">
        <div class="eyebrow">LTE</div>
        <label>APN<input id="apn" placeholder="internet" /></label>
        <div class="btns">
          <button class="btn primary" onclick="lteConnect()">Connect</button>
          <button class="btn" onclick="post('/api/lte/disconnect')">Disconnect</button>
        </div>
        <div class="msg" id="lte-msg"></div>
      </section>

      <section class="panel">
        <div class="eyebrow">Tailscale (remote access over LTE)</div>
        <label>Auth key (optional — leave blank for browser login)
          <input id="authkey" placeholder="tskey-auth-…" />
        </label>
        <div class="btns">
          <button class="btn primary" onclick="tsUp()">Bring up</button>
          <button class="btn" onclick="post('/api/tailscale/down')">Stop</button>
        </div>
        <div class="msg" id="ts-msg"></div>
      </section>

      <section class="panel">
        <div class="eyebrow">Vehicle configuration</div>
        <label>Name<input id="vehicleName" /></label>
        <div class="grid2">
          <label>Output driver
            <select id="driver">
              <option value="sim">sim</option>
              <option value="pca9685">pca9685</option>
              <option value="gpio-pwm">gpio-pwm</option>
              <option value="sbus">sbus</option>
            </select>
          </label>
          <label>Watchdog (ms)<input id="watchdogTimeoutMs" type="number" /></label>
        </div>
        <div class="grid2">
          <label>Throttle channels<input id="throttleChannels" placeholder="3" /></label>
          <label>Video base URL<input id="videoBaseUrl" placeholder="http://vehicle:1984" /></label>
        </div>
        <label class="chk"><input type="checkbox" id="disarmOnReconnect" /> Auto-disarm on reconnect <span style="color:var(--muted)">— turn OFF for aircraft (disarming in flight cuts motors)</span></label>
        <div class="btns"><button class="btn primary" onclick="saveConfig()">Save</button></div>
        <div class="msg" id="cfg-msg"></div>
      </section>

      <section class="panel">
        <div class="eyebrow">Cameras</div>
        <div id="cam-list"></div>
        <div class="btns">
          <button class="btn" onclick="addCamera()">+ Add camera</button>
          <button class="btn primary" onclick="saveCameras()">Save &amp; apply</button>
        </div>
        <div class="msg" id="cam-msg"></div>
      </section>

      <section class="panel">
        <div class="eyebrow">Telemetry (voltage / current / battery)</div>
        <div class="grid2">
          <label>Source
            <select id="telSource">
              <option value="sim">sim (no sensor)</option>
              <option value="real">real sensors</option>
            </select>
          </label>
          <label>Sample rate (Hz)<input id="telHz" type="number" placeholder="10" /></label>
        </div>
        <div class="eyebrow2">Voltage channels</div>
        <div id="volt-list"></div>
        <div class="btns"><button class="btn" onclick="addVolt()">+ Voltage</button></div>
        <div class="eyebrow2">Current channels</div>
        <div id="curr-list"></div>
        <div class="btns"><button class="btn" onclick="addCurr()">+ Current</button></div>
        <div class="grid2">
          <label>Battery capacity (mAh)<input id="capacity" type="number" placeholder="e.g. 2200" /></label>
          <label>Capacity display
            <select id="displayMode">
              <option value="remaining">x/x mAh remaining</option>
              <option value="consumed">x/x mAh consumed</option>
            </select>
          </label>
        </div>
        <label class="chk"><input type="checkbox" id="countCapacity" /> Count consumed capacity (coulomb counting)</label>
        <div class="btns">
          <button class="btn primary" onclick="saveTelemetry()">Save</button>
          <button class="btn" onclick="resetCapacity()">Reset mAh</button>
        </div>
        <div class="msg" id="tel-msg"></div>
      </section>

      <section class="panel">
        <div class="eyebrow">Hardware test — RÄDER HOCH / PROPS AB</div>
        <div class="grid2">
          <label>Channel to sweep<input id="testCh" type="number" placeholder="1" /></label>
          <div style="display:flex;align-items:flex-end"><button class="btn" onclick="sweepChannel()">Sweep (min→max→center)</button></div>
        </div>
        <div class="btns">
          <button class="btn" onclick="readSensors()">Read sensors now</button>
          <button class="btn" onclick="snapCameras()">Snapshot cameras</button>
        </div>
        <div class="msg" id="test-msg"></div>
        <div id="test-sensors"></div>
        <div id="test-cams" class="grid2"></div>
      </section>

      <section class="panel">
        <div class="eyebrow">System</div>
        <div class="btns"><button class="btn bad" onclick="reboot()">Reboot vehicle</button></div>
        <div class="msg" id="sys-msg"></div>
      </section>

      <div class="foot">YonderRC setup · configure headless, then connect from the ground app</div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      async function getJSON(u) { const r = await fetch(u); return r.json(); }
      async function post(u, body) {
        const r = await fetch(u, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
        return r.json();
      }

      function renderStatus(s) {
        const row = (k, v, cls) => `<div class="row"><span class="k">${k}</span><span class="v ${cls || ''}">${v}</span></div>`;
        const ts = s.tailscale, lte = s.lte, wifi = s.wifi;
        $('status').innerHTML =
          row('hostname', s.hostname) +
          row('mode', s.kind === 'real' ? 'real (Pi)' : 'sim', s.kind === 'real' ? 'go' : 'warn') +
          row('LTE', lte.present ? (lte.connected ? 'connected' : 'idle') : 'no modem', lte.connected ? 'go' : (lte.present ? 'warn' : 'bad')) +
          (lte.present ? row('· operator', (lte.operator || '—') + (lte.signal != null ? ` · ${lte.signal}%` : '')) : '') +
          (lte.ip ? row('· IP', lte.ip) : '') +
          row('Tailscale', ts.backendState, ts.running ? 'go' : 'warn') +
          (ts.ip ? row('· IP', ts.ip) : '') +
          row('WiFi', `${wifi.mode}${wifi.ssid ? ' · ' + wifi.ssid : ''}`);
        if (ts.loginUrl) $('ts-msg').innerHTML = `Login: <a href="${ts.loginUrl}" target="_blank" rel="noreferrer">${ts.loginUrl}</a>`;
      }

      async function refresh() { try { renderStatus(await getJSON('/api/system')); } catch {} }

      async function loadConfig() {
        const c = await getJSON('/api/config');
        $('vehicleName').value = c.vehicleName || '';
        $('driver').value = c.driver || 'sim';
        $('watchdogTimeoutMs').value = c.watchdogTimeoutMs ?? 300;
        $('throttleChannels').value = (c.throttleChannels || []).map((n) => n + 1).join(', ');
        $('videoBaseUrl').value = c.videoBaseUrl || '';
        $('disarmOnReconnect').checked = c.disarmOnReconnect !== false;
        $('apn').value = c.apn || '';
      }

      async function saveConfig() {
        const patch = {
          vehicleName: $('vehicleName').value.trim(),
          driver: $('driver').value,
          watchdogTimeoutMs: Number($('watchdogTimeoutMs').value) || 300,
          throttleChannels: $('throttleChannels').value.split(',').map((s) => Number(s.trim()) - 1).filter((n) => Number.isInteger(n) && n >= 0),
          videoBaseUrl: $('videoBaseUrl').value.trim() || null,
          disarmOnReconnect: $('disarmOnReconnect').checked,
        };
        const r = await post('/api/config', patch);
        $('cfg-msg').textContent = r.note || 'Saved.';
      }

      async function lteConnect() {
        $('lte-msg').textContent = 'Connecting…';
        const r = await post('/api/lte', { apn: $('apn').value.trim() });
        $('lte-msg').textContent = r.message || '';
        refresh();
      }
      async function tsUp() {
        $('ts-msg').textContent = 'Starting…';
        const r = await post('/api/tailscale', { authKey: $('authkey').value.trim() || undefined });
        $('ts-msg').innerHTML = r.loginUrl ? `Login: <a href="${r.loginUrl}" target="_blank" rel="noreferrer">${r.loginUrl}</a>` : (r.message || '');
        refresh();
      }
      async function reboot() {
        if (!confirm('Reboot the vehicle now?')) return;
        const r = await post('/api/reboot');
        $('sys-msg').textContent = r.message || '';
      }

      // ---- Cameras (graphical) ----
      let cams = [];
      const CAM_TYPES = ['sim', 'rpicam', 'usb'];
      function renderCams() {
        $('cam-list').innerHTML = cams.map((c, i) => `
          <div class="item">
            <div class="grid3">
              <label>Name<input value="${c.name || ''}" oninput="camSet(${i},'name',this.value)" /></label>
              <label>Type<select onchange="camSet(${i},'type',this.value)">
                ${CAM_TYPES.map((t) => `<option value="${t}" ${c.type === t ? 'selected' : ''}>${t}</option>`).join('')}
              </select></label>
              <label>Device<input value="${c.device || ''}" placeholder="/dev/video0" oninput="camSet(${i},'device',this.value)" /></label>
            </div>
            <div class="grid4">
              <label>W<input type="number" value="${c.width || 1280}" oninput="camSet(${i},'width',+this.value)" /></label>
              <label>H<input type="number" value="${c.height || 720}" oninput="camSet(${i},'height',+this.value)" /></label>
              <label>FPS<input type="number" value="${c.fps || 25}" oninput="camSet(${i},'fps',+this.value)" /></label>
              <label>kbps<input type="number" value="${c.bitrateKbps || ''}" placeholder="auto" oninput="camSet(${i},'bitrateKbps',+this.value)" /></label>
            </div>
            <div class="btns"><button class="btn tiny" onclick="camDel(${i})">Remove</button></div>
          </div>`).join('');
      }
      function camSet(i, k, v) { cams[i][k] = v; }
      function camDel(i) { cams.splice(i, 1); renderCams(); }
      function addCamera() { cams.push({ name: 'cam' + (cams.length + 1), type: 'sim', width: 1280, height: 720, fps: 25 }); renderCams(); }
      async function loadCameras() {
        const r = await getJSON('/api/cameras');
        cams = r.cameras || [];
        renderCams();
      }
      async function saveCameras() {
        $('cam-msg').textContent = 'Applying…';
        const r = await post('/api/cameras', { cameras: cams });
        $('cam-msg').textContent = r.message || 'Saved.';
      }

      // ---- Telemetry ----
      let volts = [], currs = [];
      const V_KINDS = ['sim', 'mcp3008', 'mcp3208', 'ads1115', 'ads1015'];
      const C_KINDS = ['sim', 'ina219', 'ina226', 'ina260', 'ina3221', 'acs712', 'acs758'];
      function renderVolts() {
        $('volt-list').innerHTML = volts.map((v, i) => `
          <div class="item"><div class="grid3">
            <label>Label<input value="${v.label || ''}" oninput="vSet(${i},'label',this.value)" /></label>
            <label>Sensor<select onchange="vSet(${i},'kind',this.value)">
              ${V_KINDS.map((k) => `<option value="${k}" ${v.kind === k ? 'selected' : ''}>${k}</option>`).join('')}
            </select></label>
            <label>Channel<input type="number" value="${v.channel ?? 0}" oninput="vSet(${i},'channel',+this.value)" /></label>
          </div><div class="btns"><button class="btn tiny" onclick="vDel(${i})">Remove</button></div></div>`).join('');
      }
      function renderCurrs() {
        $('curr-list').innerHTML = currs.map((c, i) => `
          <div class="item"><div class="grid3">
            <label>Label<input value="${c.label || ''}" oninput="cSet(${i},'label',this.value)" /></label>
            <label>Sensor<select onchange="cSet(${i},'kind',this.value)">
              ${C_KINDS.map((k) => `<option value="${k}" ${c.kind === k ? 'selected' : ''}>${k}</option>`).join('')}
            </select></label>
            <label>Shunt Ω<input type="number" step="0.0001" value="${c.shuntOhms ?? ''}" placeholder="0.001" oninput="cSet(${i},'shuntOhms',+this.value)" /></label>
          </div><div class="btns"><button class="btn tiny" onclick="cDel(${i})">Remove</button></div></div>`).join('');
      }
      function vSet(i, k, val) { volts[i][k] = val; }
      function cSet(i, k, val) { currs[i][k] = val; }
      function vDel(i) { volts.splice(i, 1); renderVolts(); }
      function cDel(i) { currs.splice(i, 1); renderCurrs(); }
      function addVolt() { volts.push({ label: 'Voltage ' + (volts.length + 1), kind: 'sim' }); renderVolts(); }
      function addCurr() { currs.push({ label: 'Current ' + (currs.length + 1), kind: 'sim' }); renderCurrs(); }
      async function loadTelemetry() {
        const t = await getJSON('/api/telemetry');
        $('telSource').value = t.source || 'sim';
        $('telHz').value = t.sampleHz ?? 10;
        $('capacity').value = t.batteryCapacityMah ?? '';
        $('displayMode').value = t.displayMode || 'remaining';
        $('countCapacity').checked = !!t.countCapacity;
        volts = t.voltages || [];
        currs = t.currents || [];
        renderVolts(); renderCurrs();
      }
      async function saveTelemetry() {
        const body = {
          enabled: true,
          source: $('telSource').value,
          sampleHz: Number($('telHz').value) || 10,
          voltages: volts,
          currents: currs,
          countCapacity: $('countCapacity').checked,
          batteryCapacityMah: $('capacity').value ? Number($('capacity').value) : null,
          displayMode: $('displayMode').value,
        };
        const r = await post('/api/telemetry', body);
        $('tel-msg').textContent = r.note || 'Saved.';
      }
      async function resetCapacity() {
        const r = await post('/api/telemetry/reset');
        $('tel-msg').textContent = r.message || 'Reset.';
      }

      // ---- Hardware test ----
      async function sweepChannel() {
        const ch = Number($('testCh').value) - 1;
        if (!(ch >= 0)) { $('test-msg').textContent = 'Enter a channel number.'; return; }
        $('test-msg').textContent = 'Sweeping… watch the servo.';
        const r = await post('/api/test/channel', { channel: ch });
        $('test-msg').textContent = r.message || (r.ok ? 'Done.' : 'Failed.');
      }
      async function readSensors() {
        const t = await getJSON('/api/telemetry/live');
        if (t.ok === false) { $('test-sensors').innerHTML = '<div class="msg">No sensor data (source real without sensor, or telemetry off).</div>'; return; }
        const v = (t.voltages || []).map((x) => `${x.label}: <b>${x.value} V</b>`).join(' · ');
        const c = (t.currents || []).map((x) => `${x.label}: <b>${x.value} A</b>`).join(' · ');
        $('test-sensors').innerHTML = `<div class="msg">Source: <b>${t.source}${t.ok ? '' : ' (no data)'}</b><br>${v}<br>${c}<br>${t.mah ?? 0} mAh${t.batteryPercent != null ? ' · ' + t.batteryPercent + '%' : ''}</div>`;
      }
      async function snapCameras() {
        const base = ($('videoBaseUrl').value || 'http://' + location.hostname + ':1984').replace(/\/$/, '');
        const names = cams.map((c) => c.name);
        $('test-cams').innerHTML = names.length ? names.map((n) =>
          `<div><div class="eyebrow2">${n}</div><img style="width:100%;border-radius:8px;border:1px solid var(--line)" src="${base}/api/frame.jpeg?src=${encodeURIComponent(n)}&t=${Date.now()}" onerror="this.parentNode.innerHTML='<div class=&quot;msg&quot;>${n}: no frame (is go2rtc running?)</div>'"/></div>`
        ).join('') : '<div class="msg">Add a camera first.</div>';
      }

      loadConfig();
      loadCameras();
      loadTelemetry();
      refresh();
      setInterval(refresh, 3000);
    </script>
  </body>
</html>
